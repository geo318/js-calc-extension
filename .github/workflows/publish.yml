name: Publish npm release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable package version to publish
        required: true
        type: string
  push:
    branches: ['release/npm-*']
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release identity and check npm registry
        id: preflight
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (p.name !== '@geo318/safe-calc' || !stable.test(p.version)) throw Error('Unexpected package name or non-stable version');
          if (lock.version !== p.version || lock.packages[''].version !== p.version) throw Error('Package versions do not match');
          if (process.env.GITHUB_EVENT_NAME === 'release' && process.env.RELEASE_TAG !== `v${p.version}`) throw Error('Release tag does not match package version');
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF !== `refs/heads/release/npm-${p.version}`) throw Error('Release branch does not match package version');
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && process.env.REQUESTED_VERSION !== p.version) throw Error('Requested version does not match package version');
          const [a,b,c] = execFileSync('npm', ['--version'], {encoding:'utf8'}).trim().split('.').map(Number);
          if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) throw Error('npm >=11.5.1 required for OIDC');
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(p.name)}`, {signal:AbortSignal.timeout(30000)});
          if (!response.ok) throw Error(`Registry preflight failed: HTTP ${response.status}; refusing to assume the version is available`);
          const registry = await response.json();
          if (registry.name !== p.name || !registry.versions) throw Error('Unexpected npm metadata');
          const latest = registry['dist-tags']?.latest;
          console.log(`Current npm latest: ${latest}; requested release: ${p.version}`);
          if (Object.hasOwn(registry.versions, p.version)) throw Error(`${p.name}@${p.version} already exists; refusing to republish`);
          if (typeof latest === 'string' && stable.test(latest)) {
            const targetParts = p.version.split('.').map(BigInt);
            const latestParts = latest.split('.').map(BigInt);
            for (let i = 0; i < 3; i++) {
              if (targetParts[i] < latestParts[i]) throw Error('Refusing to move npm latest backwards');
              if (targetParts[i] > latestParts[i]) break;
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${p.version}\n`);
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:reference
      - name: Publish using npm trusted publishing
        run: npm publish --access public --tag latest
      - name: Verify published npm version
        env:
          EXPECTED_VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_VERSION;
          let verified = false;
          for (let attempt = 0; attempt < 5; attempt++) {
            const r = await fetch(`https://registry.npmjs.org/@geo318%2Fsafe-calc/${expected}`, {signal:AbortSignal.timeout(15000)});
            if (r.ok) {
              const p = await r.json();
              if (p.name === '@geo318/safe-calc' && p.version === expected && p.dist?.integrity) {
                console.log(`Verified ${p.name}@${p.version}: ${p.dist.integrity}`);
                verified = true;
                break;
              }
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!verified) throw Error('Publish returned but npm registry verification failed; investigate before retrying');
          NODE
  github-release:
    needs: publish
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create GitHub release only after verified npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.VERSION;
          const notes = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n## ').find(section => section.startsWith(`${version} - `));
          if (!notes) throw Error('Missing version release notes');
          fs.writeFileSync('release-notes.md', notes.slice(notes.indexOf('\n') + 1).trim() + '\n');
          NODE
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists; leaving it unchanged."
          else
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "safe-calc ${VERSION}" --notes-file release-notes.md
          fi
